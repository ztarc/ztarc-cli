name: Signed CLI candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: cli-release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ZTARC_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/candidate.yml@${{ github.ref }}
      ZTARC_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check release source
        run: python3 scripts/ztarc.py release-check
      - name: Test and build candidate
        run: |
          make test
          make package
          python3 tests/integration/smoke.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up OCI export builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
          use: true
      - name: Build OCI archive without publishing
        run: python3 scripts/container.py
      - name: Install pinned Cosign from verified Go module
        env:
          GOTOOLCHAIN: go1.27.4
          GOBIN: ${{ github.workspace }}/build/tools
        run: |
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.4
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Sign and verify exact candidate bytes
        run: scripts/sign-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-cli-candidate
          path: dist/
          if-no-files-found: error

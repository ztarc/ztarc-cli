name: CLI checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test staged source and pipeline
        run: make test
      - name: Test fresh installation as root in an isolated container
        env:
          ZTARC_INSTALLER_CONTAINER_TESTS: '1'
          ZTARC_INSTALLER_TEST_IMAGE: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
        run: |
          docker pull "$ZTARC_INSTALLER_TEST_IMAGE"
          python3 -m unittest discover -s tests -p test_installer.py -v
      - name: Build both architectures and package
        run: make package
      - name: Smoke test metadata and guards
        run: python3 tests/integration/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-development-artifacts
          path: dist/
          if-no-files-found: error
